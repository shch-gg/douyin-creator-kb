# 元素受控词表
#
# 这是 beats.jsonl 里 func 字段的**唯一合法来源**。
# 纪律：
#   1. 想用新标签 → 先在这里加（含 name / desc），再写进 beats。
#   2. 不要指望 build_index 帮你"自动登记"——它只统计，不授权。
#      validate 会拿 beats 的 func 逐条比对本文件，没在这里的一律 ERROR。
#   3. 删标签前先 grep 全库，确认没有 beats 还在用；删了会让历史 beats 变非法。
#   4. 命名格式：<namespace>.<snake_case>，全小写 ASCII。
#
# 为什么要有这个词表：没有它，"hook.question" 和 "hook.悬念提问" 会同时存在，
# element.search 就永远搜不全同一手法——元素库的价值全在"同名可聚合"。

namespaces:
  hook: 开场钩子（前 3 秒决定完播的手法）
  turn: 转折（情节或观众认知发生变化的点）
  beat: 常规推进（叙事的最小前进单位）
  end: 收束（结尾如何处理，决定追更与二刷）
  style: 可迁移的视听手法（换题材也能用的技术选择）

elements:
  # ---- 开场钩子 ----
  - id: hook.question
    name: 悬念提问
    desc: 开场抛出一个当下不解答的问题，把答案压到后段
  - id: hook.character
    name: 人物先声
    desc: 先给人物一个反常动作或一句定性台词，再交代处境
  - id: hook.conflict
    name: 冲突开场
    desc: 第一秒就在争吵/对抗/施压中，无铺垫
  - id: hook.image
    name: 强画面开场
    desc: 以构图或光影本身抓人，信息量低但视觉冲击高
  - id: hook.text
    name: 字卡开场
    desc: 用文字板/标题卡直接给设定或命题
  - id: hook.coldopen
    name: 冷开场
    desc: 无配乐、无旁白，只有环境声或静默

  # ---- 转折 ----
  - id: turn.reveal
    name: 信息揭示
    desc: 揭开此前隐藏的事实，观众认知被改写
  - id: turn.reverse
    name: 反转
    desc: 情节走向与前面铺垫相反
  - id: turn.escalate
    name: 冲突升级
    desc: 同一矛盾加码（更狠的话、更大的代价）
  - id: turn.mislead
    name: 误导
    desc: 故意让观众得出错误判断，后段纠正
  - id: turn.identity
    name: 身份揭示
    desc: 揭示人物真实身份或关系

  # ---- 推进 ----
  - id: beat.dialogue
    name: 对话推进
    desc: 靠对白交换信息或情绪
  - id: beat.montage
    name: 蒙太奇
    desc: 多个短镜头压缩时间
  - id: beat.transition
    name: 过渡空镜
    desc: 无叙事的过场：空镜、走路、环境
  - id: beat.flashback
    name: 闪回
    desc: 插入过去时空
  - id: beat.inner_voice
    name: 旁白心声
    desc: 画外音叙述人物内心，与画面构成对照

  # ---- 收束 ----
  - id: end.cliffhanger
    name: 悬念收尾
    desc: 在最紧张处切断，不给结果
  - id: end.resolve
    name: 收束
    desc: 矛盾得到交代，情绪落地
  - id: end.twist
    name: 尾反转
    desc: 最后几秒推翻全片理解
  - id: end.quote
    name: 金句收尾
    desc: 以一句可摘录的话作结
  - id: end.echo
    name: 首尾呼应
    desc: 结尾回到开场的画面/台词，意义已变

  # ---- 视听手法 ----
  - id: style.pov
    name: 主观视角
    desc: 镜头代人物的眼睛
  - id: style.handheld
    name: 手持
    desc: 晃动镜头，制造在场感与不安
  - id: style.slowmo
    name: 升格
    desc: 慢放强调瞬间
  - id: style.text_card
    name: 手写字卡
    desc: 手写体字卡作章节或标题
  - id: style.silence
    name: 静默
    desc: 抽掉声音制造压迫或空白
  - id: style.overexpose
    name: 过曝
    desc: 高亮到细节丢失，用于记忆/失真段落
